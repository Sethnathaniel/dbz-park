server {
    listen 80;
    root /usr/share/nginx/html;

    # Same role as the Vite proxy in dev: one origin for the browser, so no CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router owns the paths: /connexion, /console… all serve the same page.
    location / {
        try_files $uri /index.html;
    }
}
