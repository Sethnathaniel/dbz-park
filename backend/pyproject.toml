[project]
name = "dbz-park-backend"
version = "0.1.0"
description = "Dragon Ball Park API — contract described in ../API.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.118",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "celery[redis]>=5.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
